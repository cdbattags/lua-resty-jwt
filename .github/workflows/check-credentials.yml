name: Check publish credentials

# Run by hand (Actions > Check publish credentials > Run workflow) to confirm
# the LuaRocks and OPM upload credentials still work, without publishing.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  credentials:
    runs-on: ubuntu-latest
    name: Check LuaRocks and OPM credentials

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Check credentials
        env:
          LUAROCKS_API_KEY: ${{ secrets.LUAROCKS_API_KEY }}
          OPM_GITHUB_ACCOUNT: ${{ secrets.OPM_GITHUB_ACCOUNT }}
          OPM_GITHUB_TOKEN: ${{ secrets.OPM_GITHUB_TOKEN }}
        run: ./ci-check-credentials
