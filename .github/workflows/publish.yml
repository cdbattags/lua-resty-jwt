name: Publish to LuaRocks & OPM

# Publishing a GitHub release for tag vX.Y.Z publishes X.Y.Z. See RELEASING.md.
# "published" fires for a new non-draft release and when a draft is
# published, never for an unpublished draft. Pre-releases fire it too, so
# every job below is skipped for them: a pre-release never uploads anything.
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    name: Check tag matches _VERSION
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Check tag matches _VERSION
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          prove -v t/version.t
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

  test:
    needs: version
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    name: Run tests
    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          persist-credentials: false

      # pin the test image by digest so the OPM job uploads with the exact
      # OpenResty build the tests ran on
      - name: Pull test image
        id: image
        run: |
          docker pull cdbattags/openresty-testsuite:latest
          IMAGE="$(docker inspect --format '{{index .RepoDigests 0}}' cdbattags/openresty-testsuite:latest)"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      # same entry point as test.yml and local runs
      - name: Run tests
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: ./ci

  luarocks:
    needs: [version, test]
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    name: LuaRocks upload

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          persist-credentials: false

      - uses: leafo/gh-actions-lua@8c9e175e7a3d77e21f809eefbee34a19b858641b # v12.0.0
        with:
          luaVersion: "5.1.5"

      - uses: leafo/gh-actions-luarocks@35d062def313a7699a0d513e996bcf4352f05389 # v6.1.0

      - name: Upload to LuaRocks
        env:
          VERSION: ${{ needs.version.outputs.version }}
          LUAROCKS_API_KEY: ${{ secrets.LUAROCKS_API_KEY }}
        run: |
          luarocks install lua-cjson
          luarocks install luasec
          luarocks new_version lua-resty-jwt-dev-0.rockspec "${VERSION}-1" \
            "git+https://github.com/cdbattags/lua-resty-jwt.git" --tag="v${VERSION}"
          cat "lua-resty-jwt-${VERSION}-1.rockspec"
          luarocks lint "lua-resty-jwt-${VERSION}-1.rockspec"
          luarocks upload "lua-resty-jwt-${VERSION}-1.rockspec" --api-key="$LUAROCKS_API_KEY"

  opm:
    needs: [version, test]
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    name: OPM upload

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          persist-credentials: false

      - name: Upload to OPM
        env:
          IMAGE: ${{ needs.test.outputs.image }}
          OPM_GITHUB_ACCOUNT: ${{ secrets.OPM_GITHUB_ACCOUNT }}
          OPM_GITHUB_TOKEN: ${{ secrets.OPM_GITHUB_TOKEN }}
        run: |
          cat > /tmp/.opmrc <<EOF
          github_account=${OPM_GITHUB_ACCOUNT}
          github_token=${OPM_GITHUB_TOKEN}
          upload_server=https://opm.openresty.org
          download_server=https://opm.openresty.org
          EOF
          docker run --rm \
            -v "${{ github.workspace }}":/pkg \
            -v /tmp/.opmrc:/root/.opmrc:ro \
            -w /pkg \
            --entrypoint=opm \
            "$IMAGE" \
            upload
